<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Team Standup Board</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&family=Source+Code+Pro:wght@500;600&display=swap"
    />
    <link rel="stylesheet" href="/styles.css" />
    <script>
      try {
        const stored = localStorage.getItem('standup-theme');
        if (stored === 'dark') document.documentElement.dataset.theme = 'dark';
      } catch {}
    </script>
  </head>
  <body>
    <header class="topbar">
      <div class="topbar__identity">
        <h1 id="team-name">Standup</h1>
        <p class="topbar__meta" id="board-meta">Loading…</p>
      </div>

      <div class="topbar__controls">
        <label class="control">
          <span>Since</span>
          <select id="lookback" class="control__select">
            <option value="24">Yesterday</option>
            <option value="48">2 days</option>
            <option value="72">3 days</option>
            <option value="168">1 week</option>
          </select>
        </label>
        <button id="theme" class="theme-toggle" type="button" title="Switch to dark" aria-label="Switch theme">☾</button>
        <button id="refresh" class="button button--primary" type="button">Refresh</button>
      </div>
    </header>

    <section class="pickers">
      <label class="picker">
        <span class="picker__label">Team</span>
        <select id="team" class="picker__select"></select>
      </label>

      <label class="picker picker--primary">
        <span class="picker__label">Sprint</span>
        <select id="sprint" class="picker__select picker__select--primary"></select>
      </label>

      <label class="picker">
        <span class="picker__label">Dev / QA</span>
        <select id="person" class="picker__select picker__select--people"></select>
      </label>
    </section>

    <nav class="tabs" id="tabs">
      <button class="tab tab--active" data-view="standup" type="button">Standup</button>
      <button class="tab" data-view="attention" type="button">
        Needs attention <span class="tab__count" id="attention-count">0</span>
      </button>
    </nav>

    <section class="totals" id="totals" aria-label="Ticket counts by lane"></section>

    <main id="view" class="view">
      <p class="placeholder">Pretending this will be a short meeting…</p>
    </main>

    <script type="module" src="/app.js"></script>
  </body>
</html>
