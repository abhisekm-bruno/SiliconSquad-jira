<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Team Standup Board</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="topbar__identity">
        <h1 id="team-name">Standup</h1>
        <p class="topbar__meta" id="board-meta">Loading…</p>
      </div>

      <div class="topbar__controls">
        <label class="control">
          <span>Since</span>
          <select id="lookback">
            <option value="24">Yesterday (24h)</option>
            <option value="48">2 days</option>
            <option value="72">3 days</option>
            <option value="168">1 week</option>
          </select>
        </label>
        <button id="refresh" class="button button--primary" type="button">Refresh</button>
      </div>
    </header>

    <nav class="tabs" id="tabs">
      <button class="tab tab--active" data-view="developers" type="button">By developer</button>
      <button class="tab" data-view="board" type="button">Board</button>
      <button class="tab" data-view="activity" type="button">Since last standup</button>
      <button class="tab" data-view="attention" type="button">
        Needs attention <span class="tab__count" id="attention-count">0</span>
      </button>
    </nav>

    <section class="totals" id="totals" aria-label="Ticket counts by lane"></section>

    <main id="view" class="view">
      <p class="placeholder">Loading the board…</p>
    </main>

    <script type="module" src="/app.js"></script>
  </body>
</html>
